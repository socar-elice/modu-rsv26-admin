.cal350-filter-row {

.cal350-filter-label {

.cal350-filter-select {

/* Month Navigation */
.cal350-month-nav {

.cal350-month-btn:hover {

}
.cal350-month-label {

  color: var(--color-text-primary); min-width: 140px; text-align: center;
}
.cal350-month-input {
  height: 36px; padding: 0 var(--space-3);
  font-size: var(--font-size-md); border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm); background: var(--color-bg-surface);
  color: var(--color-text-primary); outline: none; cursor: pointer;
}
.cal350-month-input:focus {
  border-color: var(--color-primary-main);
  box-shadow: 0 0 0 2px rgba(59,130,246,0.12);
}

/* Status Legend */
.cal350-legend {
  display: flex; align-items: center; gap: var(--space-4); margin-left: auto;
  flex-shrink: 0;
}
.cal350-legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: var(--font-size-sm); color: var(--color-text-secondary);
}
.cal350-legend-dot {
  width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
}
.cal350-legend-dot--before { background: var(--color-status-info); }
.cal350-legend-dot--parking { background: var(--color-status-success); }
.cal350-legend-dot--done { background: var(--color-status-warning); }

/* Calendar Grid */
.cal350-calendar-card {
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: var(--space-5);
}
.cal350-calendar-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);

}
.cal350-calendar-dow {
  padding: var(--space-3) var(--space-2);
  text-align: center;
  font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
  color: var(--color-text-secondary);
  background: var(--color-bg-tertiary);
  border-bottom: 1px solid var(--color-border-light);
  border-right: 1px solid var(--color-border-light);
}
.cal350-calendar-dow:nth-child(7) { border-right: none; }
.cal350-calendar-dow--sun { color: var(--color-status-error); }
.cal350-calendar-dow--sat { color: var(--color-status-info); }

.cal350-cell {
  min-height: 100px; padding: var(--space-2);
  border-bottom: 1px solid var(--color-border-light);
  border-right: 1px solid var(--color-border-light);
  cursor: pointer;
  transition: background var(--transition-fast);
  position: relative;
}
.cal350-cell:nth-child(7n) { border-right: none; }
.cal350-cell:hover { background: var(--color-bg-secondary); }
.cal350-cell--today {
  background: rgba(59,130,246,0.04);
}
.cal350-cell--selected {
  background: var(--color-primary-light) !important;
  box-shadow: inset 0 0 0 2px var(--color-primary-main);
}
.cal350-cell--empty {
  background: var(--color-bg-tertiary); cursor: default;

}
.cal350-cell--empty:hover { background: var(--color-bg-tertiary); }

  margin-bottom: var(--space-1);
  color: var(--color-text-primary);

.cal350-cell--sat .cal350-cell-date { color: var(--color-status-info); }
.cal350-cell-total {
  font-size: 11px; color: var(--color-text-tertiary);
  margin-bottom: 4px; font-weight: var(--font-weight-medium);
}
.cal350-cell-badges {
  display: flex; flex-direction: column; gap: 2px;

.cal350-badge {
  display: flex; align-items: center; gap: 4px;

.cal350-badge--before {

}
.cal350-badge--parking {
  color: #166534; background: #f0fdf4;
}
.cal350-badge--done {

.cal350-badge-dot {

.cal350-badge-dot--before { background: var(--color-status-info); }
.cal350-badge-dot--parking { background: var(--color-status-success); }
.cal350-badge-dot--done { background: var(--color-status-warning); }

  background: var(--color-bg-surface);
  white-space: nowrap;

.cal350-pay-badge--completed { color: var(--color-status-success); border-color: var(--color-status-success); }

.cal350-empty {

.cal350-empty p { font-size: var(--font-size-md); margin-top: var(--space-2); }
.cal350-empty-icon {

  font-size: var(--font-size-sm); color: #1e40af;
  margin-bottom: var(--space-4);

.cal350-info-banner svg { flex-shrink: 0; }

  padding: var(--space-2) var(--space-5);
  border-top: 1px solid var(--color-border-light);

.cal350-link-dummy {

.cal350-link-dummy:hover { text-decoration: underline; }

@media (max-width: 1024px) {

  .cal350-badge { font-size: 10px; }
  .cal350-legend { flex-wrap: wrap; }

@media (max-width: 768px) {

  .cal350-badge-dot { width: 4px; height: 4px; }
  .cal350-month-label { font-size: var(--font-size-lg); min-width: 100px; }
  .cal350-table { font-size: var(--font-size-sm); }
  .cal350-table th, .cal350-table td { padding: var(--space-2); }
}

        /**
         * 주차일 포함 판정
         * - usageStart < (D+1일 00:00)
         * - usageEnd > (D일 00:00)
         * - 단, usageEnd가 정확히 D일 00:00이면 D에 포함하지 않음 (24:00 예외)
         */
        function isTicketOnDate(ticket, dateStr) {
            // dateStr: 'YYYY-MM-DD'
            const dayStart = new Date(dateStr + 'T00:00:00');
            const nextDayStart = new Date(dayStart);
            nextDayStart.setDate(nextDayStart.getDate() + 1);

            const start = parseDateTime(ticket.usageStart);
            const end = parseDateTime(ticket.usageEnd);

            // usageStart < nextDayStart
            if (start >= nextDayStart) return false;
            // usageEnd > dayStart
            if (end <= dayStart) return false;
            // 24:00 예외: usageEnd가 정확히 dayStart와 같으면 제외
            // 위에서 end <= dayStart 로 이미 처리됨
            // 추가: usageEnd가 정확히 dayStart 다음날 00:00과 같으면? 그건 포함됨(당일).
            // 핵심: end === dayStart 일 때 제외 — 이미 end <= dayStart에서 처리
            return true;
        }

        function parseDateTime(str) {
            // 'YYYY-MM-DD HH:MM' → Date
            const [datePart, timePart] = str.split(' ');
            return new Date(datePart + 'T' + timePart + ':00');
        }

        function isExcludedStatus(status) {
            return EXCLUDED_STATUSES.includes(status);
        }

        function getActiveTickets(tickets) {
            return tickets.filter(t => !isExcludedStatus(t.usageStatus));
        }

        function getTicketsForDate(tickets, dateStr) {
            const active = getActiveTickets(tickets);
            return active.filter(t => isTicketOnDate(t, dateStr));
        }

        function countByStatus(tickets) {
            const counts = { '입차전': 0, '주차중': 0, '출차완료': 0 };
            tickets.forEach(t => {
                if (counts[t.usageStatus] !== undefined) {
                    counts[t.usageStatus]++;
                }
            });
            return counts;
        }

        function formatDate(y, m, d) {
            return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        }

        function getDaysInMonth(y, m) {
            return new Date(y, m, 0).getDate();
        }

        function getFirstDayOfWeek(y, m) {
            // 0=일, 1=월, ...
            return new Date(y, m - 1, 1).getDay();
        }

                        <div className="cal350-info-banner">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" strokeWidth="1.5"/><path d="M8 5v3M8 10v.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
                            상태/컬럼/조회조건은 하위 스토리 확정 후 조정될 수 있습니다. 이용상태: 입차전 / 주차중 / 출차완료 (3종). 집계 제외: 취소완료, 환불신청, 환불완료.
                        </div>

                        {/* Filter Placeholder */}
                        <div className="cal350-filter-card">
                            <div className="cal350-filter-disabled-overlay">
                                <span className="cal350-filter-disabled-msg">조회조건 — 추후 제공 예정 (주차장 / 상품 / 이용상태)</span>
                            </div>
                            <div className="cal350-filter-row">
                                <span className="cal350-filter-label">주차장</span>
                                <select className="cal350-filter-select" disabled>
                                    <option>전체</option>
                                </select>
                                <span className="cal350-filter-label">상품</span>
                                <select className="cal350-filter-select" disabled>
                                    <option>전체</option>
                                </select>
                                <span className="cal350-filter-label">이용상태</span>
                                <select className="cal350-filter-select" disabled>
                                    <option>전체</option>
                                </select>
                            </div>
                        </div>

                        {/* Month Navigation */}
                        <div className="cal350-month-nav">
                            <button className="cal350-month-btn" onClick={handlePrevMonth} title="이전달">◀</button>
                            <span className="cal350-month-label">{monthDisplay}</span>
                            <button className="cal350-month-btn" onClick={handleNextMonth} title="다음달">▶</button>
                            <input
                                type="month"
                                className="cal350-month-input"
                                value={monthStr}
                                onChange={handleMonthInput}
                            />
                            <div className="cal350-legend">
                                <div className="cal350-legend-item"><span className="cal350-legend-dot cal350-legend-dot--before" /> 입차전</div>
                                <div className="cal350-legend-item"><span className="cal350-legend-dot cal350-legend-dot--parking" /> 주차중</div>
                                <div className="cal350-legend-item"><span className="cal350-legend-dot cal350-legend-dot--done" /> 출차완료</div>
                            </div>
                        </div>

                        {/* Calendar */}
                        <div className="cal350-calendar-card" style={{ position: 'relative' }}>
                            {loading && (
                                <div className="cal350-loading">
                                    <div className="cal350-spinner" />
                                </div>
                            )}
                            <div className="cal350-calendar-grid">
                                {/* DOW headers */}
                                {['일','월','화','수','목','금','토'].map((d, i) => (
                                    <div key={d} className={`cal350-calendar-dow ${i === 0 ? 'cal350-calendar-dow--sun' : ''} ${i === 6 ? 'cal350-calendar-dow--sat' : ''}`}>{d}</div>
                                ))}
                                {/* Date cells */}
                                {cells.map((day, idx) => (
                                    <CalendarCell
                                        key={idx}
                                        day={day}
                                        year={year}
                                        month={month}
                                        isToday={day && year === todayYear && month === todayMonth && day === todayDate}
                                        isSelected={day && day === selectedDate}
                                        onClick={handleCellClick}
                                        tickets={MOCK_TICKETS}
                                    />
                                ))}
                            </div>
                        </div>

                        {/* Detail Table */}
                        <DetailTable
                            selectedDate={selectedDate}
                            year={year}
                            month={month}
                            tickets={MOCK_TICKETS}
                        />
                    </main>

                    <Footer />
                </div>
            );
        }

        // ============================================================
        // Render
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
