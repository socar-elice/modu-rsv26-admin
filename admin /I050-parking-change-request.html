        .action-menu-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            color: #666;

            color: #333;
            background: #f5f5f5;
            border-radius: 3px;

            right: 0;
            top: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-width: 120px;
            z-index: 10;

        }

            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .action-menu-item:last-child {
            border-bottom: none;
        }

        .action-menu-item:hover {
            background: #f5f5f5;
        }

        .action-menu-item.approve {

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;

            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #999;
        }
    </style>

                        <input type="text" className="filter-input" placeholder="검색어 입력" value={searchKeyword} onChange={(e) => setSearchKeyword(e.target.value)} />
                        <span className="filter-label">파트너명</span>
                        <input type="text" className="filter-input" placeholder="파트너명 입력" value={partnerName} onChange={(e) => setPartnerName(e.target.value)} />
                    </div>
                    <div className="filter-actions">
                        <button className="btn-search" onClick={handleSearch}>검색</button>
                    </div>
                </div>
            );
        };

        // ============================================
        // Request List Table
        // ============================================
        const RequestListTable = ({ requests, onViewDetail, onRequestNoClick, selectedIds, onSelectChange, onSelectAll, onBulkApprove, onBulkReject, onExcelDownload }) => {
            const [currentPage, setCurrentPage] = useState(1);
            const [openMenuId, setOpenMenuId] = useState(null);
            const itemsPerPage = 10;
            const totalPages = Math.ceil(requests.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedRequests = requests.slice(startIndex, startIndex + itemsPerPage);

            const pendingRequests = requests.filter(r => r.status === 'pending');
            const allPendingSelected = pendingRequests.length > 0 && pendingRequests.every(r => selectedIds.includes(r.id));
            const selectedPendingCount = requests.filter(r => selectedIds.includes(r.id) && r.status === 'pending').length;
            const canProcess = selectedPendingCount > 0;

            const toggleMenu = (id) => {
                setOpenMenuId(openMenuId === id ? null : id);
            };

            useEffect(() => {
                const handleClickOutside = () => setOpenMenuId(null);
                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, []);

            const getStatusBadge = (status) => {
                const statusMap = {
                    pending: { label: '대기', className: 'status-pending' },
                    approved: { label: '승인', className: 'status-approved' },
                    rejected: { label: '반려', className: 'status-rejected' }
                };
                const statusInfo = statusMap[status] || statusMap.pending;
                return <span className={`status-badge ${statusInfo.className}`}>{statusInfo.label}</span>;
            };

            const renderPagination = () => {
                const pages = [];
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage + 1 < 5) startPage = Math.max(1, endPage - 4);
                for (let i = startPage; i <= endPage; i++) pages.push(i);

                return (
                    <div className="pagination">
                        <button className="pagination-btn" onClick={() => setCurrentPage(1)} disabled={currentPage === 1}>«</button>
                        <button className="pagination-btn" onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))} disabled={currentPage === 1}>‹</button>
                        {pages.map(page => <button key={page} className={`pagination-btn ${currentPage === page ? 'active' : ''}`} onClick={() => setCurrentPage(page)}>{page}</button>)}
                        <button className="pagination-btn" onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))} disabled={currentPage === totalPages}>›</button>
                        <button className="pagination-btn" onClick={() => setCurrentPage(totalPages)} disabled={currentPage === totalPages}>»</button>
                        <span className="pagination-info">{startIndex + 1}-{Math.min(startIndex + itemsPerPage, requests.length)} / {requests.length}건</span>
                    </div>
                );
            };

            return (
                <div className="table-container">
                    <div className="table-header">
                        <div className="table-header-actions">
                            <button
                                className="btn btn-secondary btn-sm"
                                disabled={!canProcess}
                                onClick={onBulkApprove}
                            >
                                선택승인
                            </button>
                            <button
                                className="btn btn-secondary btn-sm"
                                disabled={!canProcess}
                                onClick={onBulkReject}
                            >
                                선택반려
                            </button>
                            {selectedPendingCount > 0 && (
                                <span className="selected-count">
                                    {selectedPendingCount}건 선택됨
                                </span>
                            )}
                        </div>
                        <div className="table-header-actions">
                            <button className="btn btn-secondary btn-sm" onClick={onExcelDownload}>
                                엑셀 다운로드
                            </button>
                        </div>
                    </div>
                    {requests.length === 0 ? (
                        <div className="empty-state"><div className="empty-icon">□</div><p className="empty-text">변경 요청이 없습니다.</p></div>
                    ) : (
                        <>
                            <table>
                                <thead>
                                    <tr>
                                        <th style={{ width: '40px' }}>
                                            <input
                                                type="checkbox"
                                                checked={allPendingSelected}
                                                onChange={(e) => onSelectAll(e.target.checked)}
                                            />
                                        </th>
                                        <th>요청번호</th>
                                        <th>구분</th>
                                        <th>일반주차장</th>
                                        <th>요청 채널</th>
                                        <th>주차장명</th>
                                        <th>파트너명</th>
                                        <th>요청 일시</th>
                                        <th>검수 상태</th>
                                        <th>검수자</th>
                                        <th>검수 일시</th>
                                        <th>반려 사유</th>
                                        <th style={{ width: '60px' }}>기능</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {paginatedRequests.map(request => (
                                        <tr key={request.id}>
                                            <td>
                                                <input
                                                    type="checkbox"
                                                    checked={selectedIds.includes(request.id)}
                                                    onChange={(e) => onSelectChange(request.id, e.target.checked)}
                                                    disabled={request.status !== 'pending'}
                                                />
                                            </td>
                                            <td>
                                                <span
                                                    className="request-no-link"
                                                    onClick={() => onRequestNoClick(request)}
                                                >
                                                    {request.id}
                                                </span>
                                            </td>
                                            <td>{request.type}</td>
                                            <td>
                                                {request.generalParkingNo ? (
                                                    <span className="general-parking-no">{request.generalParkingNo}</span>
                                                ) : '-'}
                                            </td>
                                            <td>{request.channel}</td>
                                            <td>{request.parkingName}</td>
                                            <td>{request.partnerName}</td>
                                            <td>{request.requestDate}</td>
                                            <td>{getStatusBadge(request.status)}</td>
                                            <td>{request.inspector || '-'}</td>
                                            <td>{request.inspectionDate || '-'}</td>
                                            <td style={{ maxWidth: '150px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{request.rejectReason || '-'}</td>
                                            <td>
                                                {request.status === 'pending' ? (
                                                    <div className={`action-menu ${openMenuId === request.id ? 'open' : ''}`}>
                                                        <button
                                                            className="action-menu-btn"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                toggleMenu(request.id);
                                                            }}
                                                        >
                                                            ⋯
                                                        </button>
                                                        <div className="action-menu-dropdown">
                                                            <div
                                                                className="action-menu-item approve"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setOpenMenuId(null);
                                                                    onViewDetail(request);
                                                                }}
                                                            >
                                                                상세/승인
                                                            </div>
                                                            <div
                                                                className="action-menu-item reject"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setOpenMenuId(null);
                                                                    onViewDetail(request);
                                                                }}
                                                            >
                                                                상세/반려
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <span>-</span>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {totalPages > 1 && renderPagination()}
                        </>
                    )}
                </div>
            );
        };

        // ============================================
        // Request Detail Modal
        // ============================================
        const RequestDetailModal = ({ isOpen, request, requests, onClose, onApprove, onReject }) => {
            if (!request) return null;

            // 항상 최신 상태의 request 객체를 사용
            const currentRequest = requests?.find(r => r.id === request.id) || request;

            const fields = [
                { key: 'parkingName', label: '주차장명' },
                { key: 'address', label: '주소' },
                { key: 'addressDetail', label: '상세주소' },
                { key: 'location', label: '위치좌표' },
                { key: 'totalSpaces', label: '총 주차면 수' },
                { key: 'turnoverTime', label: '회차시간' },
                { key: 'baseRate', label: '기본요금(30분)' },
                { key: 'additionalRate', label: '추가요금(10분당)' },
                { key: 'dailyMaxRate', label: '일 최대요금' },
                { key: 'monthlyRate', label: '정기권요금(월)' },
                { key: 'notes', label: '주차장 특이사항' },
                { key: 'webDiscountUrl', label: '웹할인 주소' }
            ];

            const imageFields = [
                { key: 'photo1', label: '사진 1' },
                { key: 'photo2', label: '사진 2' },
                { key: 'photo3', label: '사진 3' },
                { key: 'photo4', label: '사진 4' },
                { key: 'rateTable', label: '요금표' },
                { key: 'interior', label: '내부' },
                { key: 'ticket', label: '주차권' },
                { key: 'floorPlan', label: '평면도' }
            ];

            const isChanged = (key) => {
                return request.currentData[key] !== request.requestData[key];
            };

            const canProcess = currentRequest.status === 'pending';

            return (
                <div className={`modal-overlay ${isOpen ? 'open' : ''}`} onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3 className="modal-title">주차장 변경 요청 상세</h3>
                            <button className="modal-close" onClick={onClose}>×</button>
                        </div>
                        <div className="modal-body">
                            <div className="request-info">
                                <div className="request-info-item">
                                    <span className="request-info-label">요청번호</span>
                                    <span className="request-info-value">{request.id}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">구분</span>
                                    <span className="request-info-value">{request.type}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">일반주차장</span>
                                    <span className="request-info-value">{request.generalParkingNo || '-'}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">요청 채널</span>
                                    <span className="request-info-value">{request.channel}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">검수 상태</span>
                                    <span className="request-info-value">{request.status === 'pending' ? '대기' : request.status === 'approved' ? '승인' : '반려'}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">요청 일시</span>
                                    <span className="request-info-value">{request.requestDate}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">요청자(파트너명)</span>
                                    <span className="request-info-value">{request.partnerName}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">검수자</span>
                                    <span className="request-info-value">{request.inspector || '-'}</span>
                                </div>
                                <div className="request-info-item">
                                    <span className="request-info-label">검수 일시</span>
                                    <span className="request-info-value">{request.inspectionDate || '-'}</span>
                                </div>
                                {request.status === 'rejected' && request.rejectReason && (
                                    <div className="request-info-item" style={{ gridColumn: '1 / -1' }}>
                                        <span className="request-info-label">반려 사유</span>
                                        <span className="request-info-value" style={{ color: '#721c24' }}>{request.rejectReason}</span>
                                    </div>
                                )}
                            </div>

                            <div className="comparison-section">
                                <h4 className="comparison-section-title">주차장 정보 비교</h4>
                                <div className="comparison-table">
                                    <div className="comparison-header">항목</div>
                                    <div className="comparison-header">현재 데이터</div>
                                    <div className="comparison-header">요청 데이터</div>
                                    {fields.map(field => (
                                        <React.Fragment key={field.key}>
                                            <div className="comparison-cell">{field.label}</div>
                                            <div className="comparison-cell">{request.currentData[field.key] || '-'}</div>
                                            <div className={`comparison-cell ${isChanged(field.key) ? 'changed' : ''}`}>{request.requestData[field.key] || '-'}</div>
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>

                            <div className="image-comparison">
                                <h4 className="comparison-section-title">이미지 비교</h4>
                                <div className="image-grid">
                                    {imageFields.map(field => (
                                        <div key={field.key} className="image-item">
                                            <div className="image-label">{field.label}</div>
                                            <div className="image-row">
                                                <div className="image-box">
                                                    <div className="image-box-label">현재</div>
                                                    <div className="image-thumbnail">
                                                        {request.currentImages[field.key] ? (
                                                            <img src={request.currentImages[field.key]} alt={field.label} />
                                                        ) : (
                                                            <span>이미지 없음</span>
                                                        )}
                                                    </div>
                                                    {request.currentImages[field.key] && (
                                                        <a className="image-download" href="#" onClick={(e) => e.preventDefault()}>다운로드</a>
                                                    )}
                                                </div>
                                                <div className="image-box">
                                                    <div className="image-box-label">요청</div>
                                                    <div className="image-thumbnail">
                                                        {request.requestImages[field.key] ? (
                                                            <img src={request.requestImages[field.key]} alt={field.label} />
                                                        ) : (
                                                            <span>이미지 없음</span>
                                                        )}
                                                    </div>
                                                    {request.requestImages[field.key] && (
                                                        <a className="image-download" href="#" onClick={(e) => e.preventDefault()}>다운로드</a>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <div className="modal-footer">
                            <button className="btn btn-secondary" onClick={onClose}>닫기</button>
                            {canProcess && (
                                <>
                                    <button className="btn btn-danger" onClick={() => onReject(request)}>반려</button>
                                    <button className="btn btn-primary" onClick={() => onApprove(request)}>승인</button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================
        // Reject Reason Modal
        // ============================================
        const RejectReasonModal = ({ isOpen, onClose, onConfirm }) => {
            const [reason, setReason] = useState('');

            const handleConfirm = () => {
                if (reason.trim()) {
                    onConfirm(reason);
                    setReason('');
                }
            };

            const handleClose = () => {
                setReason('');
                onClose();
            };

            return (
                <Modal
                    isOpen={isOpen}
                    title="반려 사유 입력"
                    onClose={handleClose}
                    footer={
                        <>
                            <button className="btn btn-secondary" onClick={handleClose}>취소</button>
                            <button className="btn btn-primary" onClick={handleConfirm} disabled={!reason.trim()}>확인</button>
                        </>
                    }
                >
                    <div className="form-group">
                        <label className="form-label">반려 사유</label>
                        <textarea
                            className="form-textarea"
                            placeholder="반려 사유를 입력하세요"
                            value={reason}
                            onChange={(e) => setReason(e.target.value)}
                        />
                    </div>
                </Modal>
            );
        };

        // ============================================
        // Main App Component
        // ============================================
        const App = () => {
            const [requests, setRequests] = useState(INITIAL_REQUESTS);
            const [filteredRequests, setFilteredRequests] = useState(INITIAL_REQUESTS);
            const [selectedRequest, setSelectedRequest] = useState(null);
            const [selectedIds, setSelectedIds] = useState([]);
            const [isDetailModalOpen, setIsDetailModalOpen] = useState(false);
            const [isRejectModalOpen, setIsRejectModalOpen] = useState(false);
            const [isConfirmModalOpen, setIsConfirmModalOpen] = useState(false);
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [confirmAction, setConfirmAction] = useState(null);
            const [toasts, setToasts] = useState([]);

            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            }, []);

            const removeToast = useCallback((id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            }, []);

            const handleSearch = ({ channel, status, searchType, searchKeyword, partnerName }) => {
                let result = requests;
                if (channel) result = result.filter(req => req.channel === channel);
                if (status) result = result.filter(req => req.status === status);
                if (searchKeyword) {
                    if (searchType === 'parkingName') {
                        result = result.filter(req => req.parkingName.includes(searchKeyword));
                    } else if (searchType === 'generalParkingNo') {
                        result = result.filter(req => req.generalParkingNo && req.generalParkingNo.includes(searchKeyword));
                    } else if (searchType === 'partnerParkingNo') {
                        result = result.filter(req => req.partnerParkingNo && req.partnerParkingNo.includes(searchKeyword));
                    }
                }
                if (partnerName) result = result.filter(req => req.partnerName.includes(partnerName));
                setFilteredRequests(result);
            };

            const handleViewDetail = (request) => {
                setSelectedRequest(request);
                setIsDetailModalOpen(true);
            };

            const handleRequestNoClick = (request) => {
                if (request.channel === '아마노쉐어') {
                    alert('아마노쉐어는 기존 프로세스의 변동사항이 없으며, 이 프로토타입에서는 확인할 수 없습니다.');
                } else {
                    handleViewDetail(request);
                }
            };

            const handleDetailModalClose = () => {
                setIsDetailModalOpen(false);
                setSelectedRequest(null);
            };

            const handleApprove = (request) => {
                setConfirmAction('approve');
                setIsBulkMode(false);
                setIsConfirmModalOpen(true);
            };

            const handleReject = (request) => {
                setIsBulkMode(false);
                setIsRejectModalOpen(true);
            };

            const handleSelectChange = (id, checked) => {
                if (checked) {
                    setSelectedIds(prev => [...prev, id]);
                } else {
                    setSelectedIds(prev => prev.filter(i => i !== id));
                }
            };

            const handleSelectAll = (checked) => {
                if (checked) {
                    const pendingIds = filteredRequests.filter(r => r.status === 'pending').map(r => r.id);
                    setSelectedIds(pendingIds);
                } else {
                    setSelectedIds([]);
                }
            };

            const handleBulkApprove = () => {
                setConfirmAction('approve');
                setIsBulkMode(true);
                setIsConfirmModalOpen(true);
            };

            const handleBulkReject = () => {
                setIsBulkMode(true);
                setIsRejectModalOpen(true);
            };

            const handleExcelDownload = () => {
                showToast('엑셀 다운로드 기능은 더미입니다.', 'success');
            };

            const confirmApprove = () => {
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                if (isBulkMode) {
                    const targetIds = selectedIds;
                    setRequests(prev => prev.map(req =>
                        targetIds.includes(req.id)
                            ? { ...req, status: 'approved', inspector: 'santo', inspectionDate: dateStr }
                            : req
                    ));
                    setFilteredRequests(prev => prev.map(req =>
                        targetIds.includes(req.id)
                            ? { ...req, status: 'approved', inspector: 'santo', inspectionDate: dateStr }
                            : req
                    ));
                    showToast(`${targetIds.length}건의 변경 요청이 승인되었습니다.`, 'success');
                    setSelectedIds([]);
                } else {
                    setRequests(prev => prev.map(req =>
                        req.id === selectedRequest.id
                            ? { ...req, status: 'approved', inspector: 'santo', inspectionDate: dateStr }
                            : req
                    ));
                    setFilteredRequests(prev => prev.map(req =>
                        req.id === selectedRequest.id
                            ? { ...req, status: 'approved', inspector: 'santo', inspectionDate: dateStr }
                            : req
                    ));
                    showToast('변경 요청이 승인되었습니다.', 'success');
                    setIsDetailModalOpen(false);
                    setSelectedRequest(null);
                }
                setIsConfirmModalOpen(false);
            };

            const confirmReject = (reason) => {
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                if (isBulkMode) {
                    const targetIds = selectedIds;
                    setRequests(prev => prev.map(req =>
                        targetIds.includes(req.id)
                            ? { ...req, status: 'rejected', inspector: 'santo', inspectionDate: dateStr, rejectReason: reason }
                            : req
                    ));
                    setFilteredRequests(prev => prev.map(req =>
                        targetIds.includes(req.id)
                            ? { ...req, status: 'rejected', inspector: 'santo', inspectionDate: dateStr, rejectReason: reason }
                            : req
                    ));
                    showToast(`${targetIds.length}건의 변경 요청이 반려되었습니다.`, 'success');
                    setSelectedIds([]);
                } else {
                    setRequests(prev => prev.map(req =>
                        req.id === selectedRequest.id
                            ? { ...req, status: 'rejected', inspector: 'santo', inspectionDate: dateStr, rejectReason: reason }
                            : req
                    ));
                    setFilteredRequests(prev => prev.map(req =>
                        req.id === selectedRequest.id
                            ? { ...req, status: 'rejected', inspector: 'santo', inspectionDate: dateStr, rejectReason: reason }
                            : req
                    ));
                    showToast('변경 요청이 반려되었습니다.', 'success');
                    setIsDetailModalOpen(false);
                    setSelectedRequest(null);
                }
                setIsRejectModalOpen(false);
            };

            return (
                <AppContext.Provider value={{ showToast }}>
                    <div className="app-container">
                        <TopHeader />
                        <div className="body-container">
                            <LNB />
                            <div className="main-wrapper">
                                <main className="main-content">
                                    <h1 className="page-title">파트너 주차장 변경요청 관리</h1>
                                    <SearchFilter onSearch={handleSearch} />
                                    <RequestListTable
                                        requests={filteredRequests}
                                        onViewDetail={handleViewDetail}
                                        onRequestNoClick={handleRequestNoClick}
                                        selectedIds={selectedIds}
                                        onSelectChange={handleSelectChange}
                                        onSelectAll={handleSelectAll}
                                        onBulkApprove={handleBulkApprove}
                                        onBulkReject={handleBulkReject}
                                        onExcelDownload={handleExcelDownload}
                                    />
                                </main>
                                <footer className="footer">
                                    © 2013-2026. ModuCompany Inc. 문의: contact@moduparking.com, 1899-8342 (평일 10~19시)
                                    <br />
                                    <a href="../index.html" style={{ color: '#999', fontSize: '11px', textDecoration: 'none', marginTop: '4px', display: 'inline-block' }}>← Index로 돌아가기</a>
                                </footer>
                            </div>
                        </div>
                        <RequestDetailModal
                            isOpen={isDetailModalOpen}
                            request={selectedRequest}
                            requests={requests}
                            onClose={handleDetailModalClose}
                            onApprove={handleApprove}
                            onReject={handleReject}
                        />
                        <RejectReasonModal
                            isOpen={isRejectModalOpen}
                            onClose={() => setIsRejectModalOpen(false)}
                            onConfirm={confirmReject}
                        />
                        <Modal
                            isOpen={isConfirmModalOpen}
                            title="승인 확인"
                            onClose={() => setIsConfirmModalOpen(false)}
                            footer={
                                <>
                                    <button className="btn btn-secondary" onClick={() => setIsConfirmModalOpen(false)}>취소</button>
                                    <button className="btn btn-primary" onClick={confirmApprove}>확인</button>
                                </>
                            }
                        >
                            {isBulkMode ? (
                                <p>선택한 {selectedIds.length}건의 주차장 정보 변경 요청을 승인하시겠습니까?</p>
                            ) : (
                                <p>해당 주차장 정보 변경 요청을 승인하시겠습니까?</p>
                            )}
                        </Modal>
                        <ToastContainer toasts={toasts} removeToast={removeToast} />
                    </div>
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
