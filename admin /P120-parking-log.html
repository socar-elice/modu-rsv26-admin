<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/modu_logo.png" id="dynamic-favicon">
    <title>P120 - 입출차 확인 | 모두의주차장 파트너센터</title>
    <script>
        (function() {
            const host = window.location.host;
            let color, text;
            if (host.includes('127.0.0.1:5500')) {
                color = '#CC0000'; text = 'live';
            } else if (host.includes('localhost:3900')) {
                color = '#FFB800'; text = 'local';
            } else if (host.includes('dduks.modudev.cloud')) {
                color = '#0066CC'; text = '뚝';
            } else {
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 32, 32);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 16, 16);
            const link = document.getElementById('dynamic-favicon') || document.querySelector('link[rel="icon"]');
            if (link) link.href = canvas.toDataURL('image/png');
        })();
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* ========================================
           파트너센터 와이어프레임 스타일
           - Mobile-first 반응형 디자인
           - 카드 기반 레이아웃
           - SOCAR FRAME 2.0 Design System 적용
           ======================================== */

        /* ========================================
           Design Tokens (SOCAR FRAME 2.0)
           ======================================== */
        :root {
            /* Colors - Primary */
            --color-primary-main: #00A8FF;
            --color-primary-light: #E5F6FF;
            --color-primary-dark: #0088CC;

            /* Colors - Secondary */
            --color-secondary-main: #666666;

            /* Colors - Background */
            --color-bg-page: #F5F5F5;
            --color-bg-surface: #FFFFFF;
            --color-bg-secondary: #FAFAFA;
            --color-bg-tertiary: #F9F9F9;

            /* Colors - Text */
            --color-text-primary: #333333;
            --color-text-secondary: #666666;
            --color-text-tertiary: #888888;
            --color-text-disabled: #999999;
            --color-text-inverse: #FFFFFF;

            /* Colors - Border */
            --color-border-default: #DDDDDD;
            --color-border-light: #EEEEEE;
            --color-border-medium: #CCCCCC;
            --color-border-dark: #999999;

            /* Colors - Status */
            --color-status-error: #CC0000;
            --color-status-error-bg: #FFF5F5;
            --color-status-error-border: #FFCCCC;
            --color-status-warning: #FF6B35;
            --color-status-success: #00AA55;
            --color-status-info: #0066CC;
            --color-status-info-bg: #E8F4FF;

            /* Spacing (4px grid) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;

            /* Border Radius */
            --radius-none: 0;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;

            /* Shadow */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 8px 24px rgba(0, 0, 0, 0.2);

            /* Typography - Font Size */
            --font-size-xs: 11px;
            --font-size-sm: 12px;
            --font-size-md: 13px;
            --font-size-base: 14px;
            --font-size-lg: 15px;
            --font-size-xl: 16px;
            --font-size-2xl: 18px;
            --font-size-3xl: 20px;

            /* Typography - Font Weight */
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;

            /* Z-index */
            --z-dropdown: 100;
            --z-modal: 2000;
            --z-toast: 3000;

            /* Transition */
            --transition-fast: 0.15s;
            --transition-base: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: var(--font-size-base);
            line-height: 1.5;
            color: var(--color-text-primary);
            background: var(--color-bg-page);
        }

        /* ========================================
           Mobile-first 레이아웃
           ======================================== */
        .layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 모바일: LNB 숨김, 햄버거 메뉴 표시 */
        .lnb {
            display: none;
        }

        .mobile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-surface);
            border-bottom: 1px solid var(--color-border-default);
            position: sticky;
            top: 0;
            z-index: var(--z-dropdown);
        }

        .mobile-header-brand {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-lg);
        }

        .mobile-menu-btn {
            padding: var(--space-2);
            background: none;
            border: 1px solid var(--color-border-default);
            cursor: pointer;
            font-size: var(--font-size-2xl);
            line-height: 1;
        }

        /* 메인 영역 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-right 0.3s ease;
        }

        .main-area.drawer-open {
            margin-right: 0;
        }

        /* 상단 헤더 */
        .header {
            background: var(--color-bg-surface);
            border-bottom: 1px solid var(--color-border-default);
            padding: var(--space-4);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
        }

        .header-description {
            margin-top: var(--space-1);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .prototype-link {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            padding: var(--space-1) var(--space-3);
            border: 1px dashed var(--color-border-medium);
            background: var(--color-bg-secondary);
            white-space: nowrap;
        }

        .prototype-link:hover {
            background: var(--color-bg-tertiary);
            border-color: var(--color-border-dark);
        }

        /* 콘텐츠 영역 */
        .content {
            flex: 1;
            padding: var(--space-4);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .content-box {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        /* ========================================
           필터 컨테이너 (P070 스타일 통일)
           ======================================== */
        .filter-container {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
        }

        /* 상태 탭 (P070 type-tabs 스타일 통일) */
        .status-tabs-wrapper {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4) var(--space-5);
            padding-bottom: 0;
        }

        .status-tabs-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
            white-space: nowrap;
        }

        .status-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--color-border-light);
            flex: 1;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .status-tab {
            flex-shrink: 0;
            padding: var(--space-3) var(--space-5);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .status-tab:hover {
            color: var(--color-text-primary);
        }

        .status-tab.active {
            color: var(--color-primary-main);
            font-weight: var(--font-weight-semibold);
        }

        .status-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-primary-main);
        }

        /* 필터 영역 (P070 filter-area 스타일 통일) */
        .filter-section {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5);
            padding-bottom: var(--space-4);
            border-top: 1px solid var(--color-border-light);
            flex-wrap: wrap;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex: 0 0 auto;
        }

        .filter-item label {
            font-size: var(--font-size-md);
            color: var(--color-text-secondary);
            white-space: nowrap;
        }

        .filter-item select,
        .filter-item input {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border-medium);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-md);
            min-width: 150px;
            background: var(--color-bg-surface);
            color: var(--color-text-primary);
            transition: border-color var(--transition-fast);
        }

        .filter-item select:focus,
        .filter-item input:focus {
            outline: none;
            border-color: var(--color-primary-main);
        }

        .filter-item input[type="date"] {
            min-width: 140px;
        }

        .filter-item input[type="text"] {
            min-width: 160px;
        }


        /* ========================================
           카드 리스트 (모바일 퍼스트)
           ======================================== */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .vehicle-card {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            padding: var(--space-4);
            cursor: pointer;
            transition: box-shadow var(--transition-fast);
        }

        .vehicle-card:hover {
            box-shadow: var(--shadow-md);
        }

        .vehicle-card:active {
            background: var(--color-bg-tertiary);
        }

        .vehicle-card.cancelled .card-vehicle-number,
        .vehicle-card.cancelled .card-value,
        .vehicle-card.cancelled .card-parking-lot {
            color: var(--color-text-disabled);
        }

        .vehicle-card.cancelled .product-type-tag {
            color: var(--color-text-disabled);
            border-color: var(--color-border-medium);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-3);
        }

        .card-vehicle-number {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .product-type-tag {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            font-size: 10px;
            border: 1px solid var(--color-text-tertiary);
            background: var(--color-bg-surface);
            font-weight: var(--font-weight-medium);
        }

        .product-type-tag.pass {
            border-color: var(--color-status-info);
            color: var(--color-status-info);
            background: var(--color-bg-surface);
        }

        .card-status {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-size-xs);
            border: 1px solid;
            white-space: nowrap;
        }

        .card-status.success {
            border-color: var(--color-border-dark);
            color: var(--color-text-primary);
        }

        .card-status.cancel {
            border-color: var(--color-border-medium);
            color: var(--color-text-secondary);
            background: var(--color-bg-page);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .card-row {
            display: flex;
            font-size: var(--font-size-md);
        }

        .card-label {
            width: 80px;
            color: var(--color-text-secondary);
            flex-shrink: 0;
        }

        .card-value {
            flex: 1;
            color: var(--color-text-primary);
        }

        .card-value.highlight {
            font-weight: var(--font-weight-semibold);
        }

        .card-footer {
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--color-border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-parking-lot {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .parking-type-tag {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            font-size: 10px;
            border: 1px solid var(--color-text-secondary);
            margin-left: var(--space-2);
            vertical-align: middle;
        }

        .card-time-info {
            display: flex;
            gap: var(--space-3);
            font-size: var(--font-size-sm);
        }

        .time-badge {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .time-badge-label {
            color: var(--color-text-tertiary);
        }

        .time-badge-value {
            color: var(--color-text-primary);
            font-weight: var(--font-weight-medium);
        }

        .time-badge-value.empty {
            color: var(--color-border-medium);
        }

        /* 목록 헤더 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-3);
        }

        .list-header-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
        }

        /* ========================================
           데이터 테이블 (PC용)
           ======================================== */
        .table-wrapper {
            display: none; /* 모바일에서 숨김 */
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .data-table th,
        .data-table td {
            padding: var(--space-3);
            text-align: left;
            border-bottom: 1px solid var(--color-border-light);
            font-size: var(--font-size-md);
            vertical-align: middle;
        }

        .data-table th {
            background: var(--color-bg-tertiary);
            font-weight: var(--font-weight-semibold);
            border-bottom: 2px solid var(--color-border-default);
            white-space: nowrap;
        }

        .data-table tbody tr {
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        .data-table tbody tr:hover {
            background: var(--color-bg-tertiary);
        }

        .data-table tbody tr.cancelled {
            color: var(--color-text-disabled);
        }

        .data-table tbody tr.cancelled .product-type-tag {
            color: var(--color-text-disabled);
            border-color: var(--color-border-medium);
        }

        .data-table .col-center {
            text-align: center;
        }

        .data-table .col-right {
            text-align: right;
        }

        .data-table .col-nowrap {
            white-space: nowrap;
        }

        .table-vehicle-number {
            font-weight: var(--font-weight-semibold);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .table-status {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            font-size: var(--font-size-xs);
            border: 1px solid;
            white-space: nowrap;
        }

        .table-status.success {
            border-color: var(--color-border-dark);
            color: var(--color-text-primary);
        }

        .table-status.cancel {
            border-color: var(--color-border-medium);
            color: var(--color-text-secondary);
            background: var(--color-bg-page);
        }

        .table-parking-name {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .table-time {
            white-space: nowrap;
        }

        .table-time.empty {
            color: var(--color-border-medium);
        }

        /* 테이블 날짜 두 줄 표시 */
        .table-datetime-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.3;
        }

        .table-date {
            font-size: var(--font-size-md);
            color: var(--color-text-primary);
        }

        .table-time-value {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        /* 빈 목록 */
        .empty-list {
            padding: var(--space-10) var(--space-5);
            text-align: center;
            color: var(--color-text-secondary);
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
        }

        /* ========================================
           Right Panel (Push 방식 - 콘텐츠를 밀어내는 형태)
           ======================================== */
        .panel-container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: flex 0.3s ease;
        }

        .panel-main.panel-open {
            flex: 1;
        }

        .panel {
            width: 0;
            height: 100%;
            background: var(--color-bg-surface);
            border-left: 1px solid var(--color-border-default);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width var(--transition-base) ease;
        }

        .panel.open {
            width: 100%;
        }

        /* 모바일에서는 전체 화면 오버레이 */
        @media (max-width: 767px) {
            .panel.open {
                position: fixed;
                top: 0;
                right: 0;
                width: 100%;
                height: 100vh;
                z-index: 1001;
            }
        }

        .panel-header {
            padding: var(--space-4);
            border-bottom: 1px solid var(--color-border-default);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-bg-surface);
            flex-shrink: 0;
        }

        .panel-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
        }

        .panel-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 0;
            line-height: 1;
        }

        .panel-close:hover {
            color: var(--color-text-primary);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4);
        }

        .panel-footer {
            padding: var(--space-4);
            border-top: 1px solid var(--color-border-default);
            background: var(--color-bg-surface);
            flex-shrink: 0;
        }

        /* Drawer 상세 정보 */
        .detail-section {
            margin-bottom: var(--space-5);
        }

        .detail-section-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-md);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--color-border-light);
            color: var(--color-text-primary);
        }

        .detail-row {
            display: flex;
            margin-bottom: var(--space-2);
            font-size: var(--font-size-md);
        }

        .detail-label {
            width: 100px;
            color: var(--color-text-secondary);
            flex-shrink: 0;
        }

        .detail-value {
            flex: 1;
        }

        .detail-value.highlight {
            font-weight: var(--font-weight-semibold);
        }

        /* 검색 가능한 드롭다운 (필터용) */
        .searchable-dropdown {
            position: relative;
            min-width: 180px;
        }
        .searchable-dropdown-input {
            width: 100%;
            padding: var(--space-2) 30px var(--space-2) var(--space-3);
            border: 1px solid var(--color-border-medium);
            font-size: var(--font-size-md);
            background: var(--color-bg-surface);
            cursor: pointer;
        }
        .searchable-dropdown-input:focus {
            outline: none;
            border-color: var(--color-text-secondary);
        }
        .searchable-dropdown-input::placeholder {
            color: var(--color-text-disabled);
        }
        .searchable-dropdown-arrow {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--color-text-secondary);
            font-size: 10px;
        }
        .searchable-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-medium);
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: var(--z-dropdown);
            box-shadow: var(--shadow-md);
        }
        .searchable-dropdown-item {
            padding: var(--space-2) var(--space-3);
            cursor: pointer;
            font-size: var(--font-size-md);
        }
        .searchable-dropdown-item:hover {
            background: var(--color-bg-page);
        }

    <script type="text/babel">
        /**
         * ================================================

         * ================================================

        const { useState, useMemo, useEffect } = React;

        // ================================================
        // 시스템 표준 일시 포맷
        // ================================================
        const formatDateTime = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatShortTime = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        };

        // 테이블용 두 줄 날짜 포맷 (yyyy-mm-dd / hh:mm)
        const formatDateTimeTwoLines = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return { date: `${year}-${month}-${day}`, time: `${hours}:${minutes}` };
        };

        const formatDateRange = (startDate, endDate) => {
            if (!startDate || !endDate) return '-';
            return `${formatDateTime(startDate)} ~ ${formatDateTime(endDate)}`;

        function SearchableDropdown({ options, value, onChange, placeholder = '전체', allLabel = '전체' }) {
            const [isOpen, setIsOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const dropdownRef = React.useRef(null);

            const selectedLabel = useMemo(() => {
                if (!value) return '';
                const selected = options.find(opt => opt.id === value);
                return selected ? selected.name : '';
            }, [value, options]);

            const filteredOptions = useMemo(() => {
                if (!searchTerm.trim()) return options;
                const searchLower = searchTerm.toLowerCase();
                return options.filter(opt => opt.name.toLowerCase().includes(searchLower));
            }, [options, searchTerm]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                        setIsOpen(false);
                        setSearchTerm('');
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSelect = (optionId) => {
                onChange(optionId);
                setIsOpen(false);
                setSearchTerm('');
            };

            return (
                <div className="searchable-dropdown" ref={dropdownRef}>
                    <input
                        type="text"
                        className="searchable-dropdown-input"
                        placeholder={placeholder}
                        value={isOpen ? searchTerm : selectedLabel}
                        onChange={e => { setSearchTerm(e.target.value); if (!isOpen) setIsOpen(true); }}
                        onFocus={() => setIsOpen(true)}
                    />
                    <span className="searchable-dropdown-arrow">▼</span>
                    {isOpen && (
                        <div className="searchable-dropdown-menu">
                            <div className={`searchable-dropdown-item all ${!value ? 'selected' : ''}`} onClick={() => handleSelect('')}>{allLabel}</div>
                            {filteredOptions.length === 0 ? (
                                <div className="searchable-dropdown-empty">검색 결과가 없습니다. 다른 검색어를 입력해주세요.</div>
                            ) : (
                                filteredOptions.map(opt => (
                                    <div key={opt.id} className={`searchable-dropdown-item ${value === opt.id ? 'selected' : ''}`} onClick={() => handleSelect(opt.id)}>{opt.name}</div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function Pagination({ currentPage, totalPages, onPageChange, totalItems, itemsPerPage }) {
            if (totalPages <= 1) return null;

            const getPageNumbers = () => {
                const pages = [];
                const maxVisible = 5;
                let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let end = Math.min(totalPages, start + maxVisible - 1);

                if (end - start + 1 < maxVisible) {
                    start = Math.max(1, end - maxVisible + 1);
                }

                for (let i = start; i <= end; i++) {
                    pages.push(i);
                }
                return pages;
            };

            const currentCount = Math.min(currentPage * (itemsPerPage || 10), totalItems || 0);
            const hasMore = currentPage < totalPages;

            return (
                <React.Fragment>
                    {/* 데스크톱: 페이지네이션 */}
                    <div className="pagination">
                        <button
                            className="pagination-btn"
                            onClick={() => onPageChange(1)}
                            disabled={currentPage === 1}
                        >
                            &laquo;
                        </button>
                        <button
                            className="pagination-btn"
                            onClick={() => onPageChange(currentPage - 1)}
                            disabled={currentPage === 1}
                        >
                            &lt;
                        </button>
                        {getPageNumbers().map(page => (
                            <button
                                key={page}
                                className={`pagination-btn ${currentPage === page ? 'active' : ''}`}
                                onClick={() => onPageChange(page)}
                            >
                                {page}
                            </button>
                        ))}
                        <button
                            className="pagination-btn"
                            onClick={() => onPageChange(currentPage + 1)}
                            disabled={currentPage === totalPages}
                        >
                            &gt;
                        </button>
                        <button
                            className="pagination-btn"
                            onClick={() => onPageChange(totalPages)}
                            disabled={currentPage === totalPages}
                        >
                            &raquo;
                        </button>
                    </div>
                    {/* 모바일: 더보기 버튼 */}
                    <div className="load-more-wrapper">
                        <button
                            className="load-more-btn"
                            onClick={() => onPageChange(currentPage + 1)}
                            disabled={!hasMore}
                        >
                            {hasMore ? '더보기' : '마지막 항목입니다'}
                        </button>
                        {totalItems > 0 && (
                            <div className="load-more-info">
                                {currentCount} / {totalItems}개
                            </div>
                        )}
                    </div>
                </React.Fragment>
            );
        }

        // ================================================
        // 메인 App 컴포넌트
        // ================================================
        function App() {
            const hasAccess = checkPageAccess(CURRENT_USER);

            const [selectedDate, setSelectedDate] = useState('2026-01-19');
            const [selectedParkingLot, setSelectedParkingLot] = useState('');
            const [selectedProductType, setSelectedProductType] = useState('');
            const [selectedEntryStatus, setSelectedEntryStatus] = useState('');
            const [vehicleSearch, setVehicleSearch] = useState('');
            const [vehicles, setVehicles] = useState(DUMMY_VEHICLES);
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            const [toast, setToast] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [safeNumberModal, setSafeNumberModal] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);

            // 필터링된 차량 목록
            const filteredVehicles = useMemo(() => {
                if (!selectedDate) return [];

                const selectedDateStart = new Date(selectedDate);
                selectedDateStart.setHours(0, 0, 0, 0);
                const selectedDateEnd = new Date(selectedDate);
                selectedDateEnd.setHours(23, 59, 59, 999);

                // 현재 시간
                const now = new Date();

                return vehicles.filter(vehicle => {
                    // 주차장 필터
                    if (selectedParkingLot && vehicle.parkingLotId !== selectedParkingLot) {
                        return false;
                    }

                    // 상품유형 필터
                    if (selectedProductType) {
                        const vehicleProductType = vehicle.productType === '정기권' ? '정기권' : '일반권';
                        if (vehicleProductType !== selectedProductType) {
                            return false;
                        }
                    }

                    // 입차상태 필터
                    if (selectedEntryStatus) {
                        const hasEntryTime = !!vehicle.entryTime;
                        const hasExitTime = !!vehicle.exitTime;
                        const usageEnd = new Date(vehicle.usagePeriodEnd);
                        const isExpired = now > usageEnd;

                        // 입차상태 판별
                        let vehicleEntryStatus = '';
                        if (!hasEntryTime) {
                            // 입차일시가 없는 경우 -> 입차예정
                            vehicleEntryStatus = '입차예정';
                        } else if (hasEntryTime && !hasExitTime && !isExpired) {
                            // 입차일시가 있고, 출차일시가 없고, 이용기간이 초과되지 않은 경우 -> 입차중
                            vehicleEntryStatus = '입차중';
                        } else if (hasExitTime || isExpired) {
                            // 출차일시가 있거나, 이용기간이 지난 경우 -> 출차
                            vehicleEntryStatus = '출차';
                        }

                        if (vehicleEntryStatus !== selectedEntryStatus) {
                            return false;
                        }
                    }

                    // 차량번호 검색 필터
                    if (vehicleSearch && !vehicle.vehicleNumber.includes(vehicleSearch)) {
                        return false;
                    }

                    // 날짜 필터: 선택한 날짜가 이용기간에 포함되는지
                    const usageStart = new Date(vehicle.usagePeriodStart);
                    const usageEnd = new Date(vehicle.usagePeriodEnd);

                    return usageStart <= selectedDateEnd && usageEnd >= selectedDateStart;
                }).sort((a, b) => {
                    if (!a.entryTime && !b.entryTime) return 0;
                    if (!a.entryTime) return 1;
                    if (!b.entryTime) return -1;
                    return new Date(b.entryTime) - new Date(a.entryTime);
                });
            }, [selectedDate, selectedParkingLot, selectedProductType, selectedEntryStatus, vehicleSearch, vehicles]);

            const totalPages = Math.ceil(filteredVehicles.length / ITEMS_PER_PAGE);

            const paginatedVehicles = useMemo(() => {
                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredVehicles.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            }, [filteredVehicles, currentPage]);

            const handlePageChange = (page) => {
                setCurrentPage(page);
                setSelectedVehicle(null);
            };

            // 필터 변경 시 페이지 리셋
            useEffect(() => {
                setCurrentPage(1);
            }, [selectedDate, selectedParkingLot, selectedProductType, selectedEntryStatus, vehicleSearch]);

            const handleVehicleClick = (vehicle) => {
                setSelectedVehicle(vehicle);
            };

            const handleEntry = (vehicle) => {
                const now = new Date();
                const entryTime = formatDateTime(now);

                setVehicles(prev => prev.map(v =>
                    v.id === vehicle.id
                        ? { ...v, entryTime: now.toISOString() }
                        : v
                ));

                setSelectedVehicle(prev => ({
                    ...prev,
                    entryTime: now.toISOString()
                }));

                setToast(`[${vehicle.vehicleNumber}] 입차 처리되었습니다.`);

                console.log('[Audit Log] 입차 처리:', {
                    vehicleId: vehicle.id,
                    vehicleNumber: vehicle.vehicleNumber,
                    parkingLotName: vehicle.parkingLotName,
                    entryTime: entryTime,
                    processedBy: CURRENT_USER.name
                });
            };

            const handleExit = (vehicle) => {
                const now = new Date();
                const exitTime = formatDateTime(now);

                setVehicles(prev => prev.map(v =>
                    v.id === vehicle.id
                        ? { ...v, exitTime: now.toISOString() }
                        : v
                ));

                setSelectedVehicle(prev => ({
                    ...prev,
                    exitTime: now.toISOString()
                }));

                setToast(`[${vehicle.vehicleNumber}] 출차 처리되었습니다.`);

                console.log('[Audit Log] 출차 처리:', {
                    vehicleId: vehicle.id,
                    vehicleNumber: vehicle.vehicleNumber,
                    parkingLotName: vehicle.parkingLotName,
                    exitTime: exitTime,
                    processedBy: CURRENT_USER.name
                });
            };

            const handleSafeNumberClick = () => {
                if (selectedVehicle && selectedVehicle.safeNumber) {
                    setSafeNumberModal(selectedVehicle);
                    console.log('[Audit Log] 안심번호 조회:', {
                        vehicleId: selectedVehicle.id,
                        vehicleNumber: selectedVehicle.vehicleNumber,
                        timestamp: new Date().toISOString(),
                        viewedBy: CURRENT_USER.name
                    });
                }
            };

            if (!hasAccess) {
                return (
                    <div className="layout">
                        <LNB user={CURRENT_USER} />
                        <div className="main-area">
                            <div className="mobile-header">
                                <span className="mobile-header-brand">파트너센터</span>
                                <button className="mobile-menu-btn" onClick={() => setMobileMenuOpen(true)}>
                                    ☰
                                </button>
                            </div>
                            <Header
                                title="입출차 확인"
                                description="주차권을 구매한 고객의 차량 입출차 현황을 확인하고 처리할 수 있어요."
                            />
                            <main className="content">
                                <PageAccessDenied />
                            </main>
                        </div>
                        <MobileMenu
                            user={CURRENT_USER}
                            isOpen={mobileMenuOpen}
                            onClose={() => setMobileMenuOpen(false)}
                        />
                    </div>
                );
            }

            const isPanelOpen = !!selectedVehicle;

            return (
                <div className="layout">
                    <LNB user={CURRENT_USER} />
                    <div className={`main-area ${isPanelOpen ? 'drawer-open' : ''}`}>
                        <div className="mobile-header">
                            <span className="mobile-header-brand">파트너센터</span>
                            <button className="mobile-menu-btn" onClick={() => setMobileMenuOpen(true)}>
                                ☰
                            </button>
                        </div>
                        <Header
                            title="입출차 확인"
                            description="관리 권한이 있는 주차장의 입출차 현황을 확인합니다."
                        />
                        <div className="panel-container">
                            <div className={`panel-main ${isPanelOpen ? 'panel-open' : ''}`}>
                                <main className="content">
                                    <FilterSection
                                        selectedDate={selectedDate}
                                        selectedParkingLot={selectedParkingLot}
                                        selectedProductType={selectedProductType}
                                        selectedEntryStatus={selectedEntryStatus}
                                        vehicleSearch={vehicleSearch}
                                        parkingLots={CURRENT_USER.parkingLots}
                                        onDateChange={setSelectedDate}
                                        onParkingLotChange={setSelectedParkingLot}
                                        onProductTypeChange={setSelectedProductType}
                                        onEntryStatusChange={setSelectedEntryStatus}
                                        onVehicleSearchChange={setVehicleSearch}
                                    />

                                    <div className="content-box">
                                        <div className="list-header">
                                            <span className="list-header-title">
                                                차량 목록
                                            </span>
                                        </div>

                                        <VehicleList
                                            vehicles={paginatedVehicles}
                                            onVehicleClick={handleVehicleClick}
                                            currentPage={currentPage}
                                            totalPages={totalPages}
                                            onPageChange={handlePageChange}
                                            totalItems={filteredVehicles.length}
                                        />
                                    </div>
                                </main>
                            </div>

                            <VehicleDetailPanel
                                vehicle={selectedVehicle}
                                isOpen={isPanelOpen}
                                onClose={() => setSelectedVehicle(null)}
                                onEntry={handleEntry}
                                onExit={handleExit}
                                onSafeNumberClick={handleSafeNumberClick}
                            />
                        </div>

                        {toast && (
                            <Toast
                                message={toast}
                                onClose={() => setToast(null)}
                            />
                        )}

                        {safeNumberModal && (
                            <SafeNumberModal
                                vehicle={safeNumberModal}
                                onClose={() => setSafeNumberModal(null)}
                            />
                        )}
                    </div>

                    <MobileMenu
                        user={CURRENT_USER}
                        isOpen={mobileMenuOpen}
                        onClose={() => setMobileMenuOpen(false)}
                    />
                    <ScrollToTop />
                </div>
            );
        }

        // ================================================
        // 앱 마운트
        // ================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <!-- 개발 프로토타입 전용 -->
    <div class="page-footer">프레디 로저 세바스찬 산토 화이팅</div>
</body>
</html>
