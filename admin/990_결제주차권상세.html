        <style>
/* ============================================================
   Page-specific: 360_결제주차권상세
   ============================================================ */

/* App Layout */
.app-layout { display: flex; min-height: 100vh; padding-top: var(--header-h); }
.app-layout > .main { flex: 1; min-width: 0; overflow-x: hidden; margin-top: 0; }

/* Page Header */
.page-header { margin-bottom: var(--space-6); }
.page-title {
  font-size: 22px; font-weight: var(--font-weight-bold);
  color: var(--color-text-primary); margin-bottom: var(--space-1);
}
.page-subtitle {
  font-size: var(--font-size-md); color: var(--color-text-secondary);
}

/* Badges (340 동일) */
.product-type-tag {
  display: inline-block; padding: 2px 6px;
  font-size: 10px; font-weight: var(--font-weight-medium);
  border: 1px solid var(--color-text-tertiary); color: var(--color-text-tertiary);
  border-radius: 2px; white-space: nowrap;
}
.product-type-tag.pass { border-color: var(--color-status-info); color: var(--color-status-info); }
.product-type-tag.share { border-color: var(--color-status-success); color: var(--color-status-success); }
.product-type-tag.resident { border-color: #8B5CF6; color: #8B5CF6; }
.product-type-tag.short { border-color: var(--color-status-warning); color: var(--color-status-warning); }
.parking-type-tag {
  display: inline-block; padding: 2px 6px;
  font-size: 10px; font-weight: var(--font-weight-medium);
  background: var(--color-bg-secondary); color: var(--color-text-secondary);
  border: 1px solid var(--color-border-default); border-radius: 2px;
}

/* Payment Status */
.payment-status {
  display: inline-flex; align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
  border: 1px solid var(--color-border-default); border-radius: var(--radius-sm);
  background: var(--color-bg-surface); white-space: nowrap;
}
.payment-status.completed { color: var(--color-status-success); border-color: var(--color-status-success); }
.payment-status.cancelled { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }

/* Entry Status */
.entry-status {
  display: inline-flex; align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
  border-radius: var(--radius-sm); white-space: nowrap;
}
.entry-status.waiting { color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0; }
.entry-status.available { color: #4d7060; background: #f7faf8; border: 1px solid #d5e5da; }
.entry-status.active { color: #2563eb; background: #f0f4ff; border: 1px solid #dbeafe; }
.entry-status.done { color: #6b7280; background: #f9fafb; border: 1px solid #e5e7eb; }

/* Detail Sections */
.detail-card {
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-5);
  overflow: hidden;
}
.detail-card__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border-light);
  background: var(--color-bg-tertiary);
}
.detail-card__header h3 {
  font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
  color: var(--color-text-primary); margin: 0;
}
.detail-card__body {
  padding: var(--space-5) var(--space-6);
}

/* Detail Grid (key-value) */
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}
.detail-item { display: flex; flex-direction: column; gap: 2px; }
.detail-item.full { grid-column: 1 / -1; }
.detail-label {
  font-size: var(--font-size-xs); color: var(--color-text-tertiary);
  font-weight: var(--font-weight-medium);
}
.detail-value {
  font-size: var(--font-size-base); color: var(--color-text-primary);
  font-weight: var(--font-weight-medium);
}

/* Link Button */
.link-action {
  background: none; border: none; padding: 0;
  color: var(--color-primary-main); font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold); cursor: pointer;
  text-decoration: underline; font-family: inherit;
}
.link-action:hover { color: var(--color-primary-dark); }

/* Demo Switcher */
.demo-switcher {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-6);
  margin-bottom: var(--space-5);
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
}
.demo-switcher__label {
  font-size: var(--font-size-md); font-weight: var(--font-weight-semibold);
  color: #92400e; white-space: nowrap;
}
.demo-switcher__buttons {
  display: flex; gap: 4px; flex-wrap: wrap;
}
.demo-switcher__btn {
  height: 36px; padding: 0 var(--space-4);
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--color-border-default); border-radius: var(--radius-sm);
  font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
  color: var(--color-text-secondary); background: var(--color-bg-surface);
  cursor: pointer; transition: all var(--transition-fast); white-space: nowrap;
}
.demo-switcher__btn:hover { background: var(--color-bg-secondary); border-color: var(--color-border-medium); }
.demo-switcher__btn.active {
  background: var(--color-primary-main); color: var(--color-text-inverse);
  border-color: var(--color-primary-main);
}

/* Entry Processing Form */
.entry-form {
  display: flex; align-items: flex-end; gap: var(--space-3); flex-wrap: wrap;
  margin-bottom: var(--space-5);
  padding: var(--space-4);
  background: var(--color-bg-secondary);
  border-radius: var(--radius-sm);
}
.entry-form__group {
  display: flex; flex-direction: column; gap: 4px;
}
.entry-form__label {
  font-size: var(--font-size-xs); color: var(--color-text-tertiary);
  font-weight: var(--font-weight-medium);
}
.entry-form__input {
  height: 36px; padding: 0 var(--space-3);
  font-size: var(--font-size-md); border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm); background: var(--color-bg-surface);
  color: var(--color-text-primary); outline: none;
  transition: border-color var(--transition-fast);
}
.entry-form__input:focus {
  border-color: var(--color-primary-main);
  box-shadow: 0 0 0 2px rgba(59,130,246,0.12);
}

/* Processing History Table */
.history-table {
  width: 100%; border-collapse: collapse;
}
.history-table th {
  background: var(--color-bg-tertiary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-sm); color: var(--color-text-secondary);
  padding: var(--space-3); text-align: center;
  border-bottom: 2px solid var(--color-border-default);
}
.history-table td {
  padding: var(--space-3); text-align: center;
  font-size: var(--font-size-md); color: var(--color-text-primary);
  border-bottom: 1px solid var(--color-border-light);
}
.history-table tbody tr:last-child td { border-bottom: none; }

/* Edit Input */
.detail-edit-input {
  width: 100%; padding: 6px 10px;
  font-size: var(--font-size-md); color: var(--color-text-primary);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-sm); background: var(--color-bg-surface);
  outline: none; transition: border-color var(--transition-fast);
  font-family: inherit;
}
.detail-edit-input:focus { border-color: var(--color-primary-main); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

/* Detail Actions */
.detail-actions {
  display: flex; gap: var(--space-2); margin-top: var(--space-4);
}

/* Summary List */
.summary-list {
  list-style: none; padding: 0; margin: 0;
}
.summary-list li {
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--color-border-light);
  display: flex; gap: var(--space-4);
}
.summary-list li:last-child { border-bottom: none; }
.summary-list__label {
  min-width: 140px; flex-shrink: 0;
  font-size: var(--font-size-sm); color: var(--color-text-tertiary);
  font-weight: var(--font-weight-medium);
}
.summary-list__value {
  font-size: var(--font-size-md); color: var(--color-text-primary);
  line-height: 1.5; white-space: pre-wrap;
}

/* Empty State */
.empty-state {
  text-align: center; padding: var(--space-10) var(--space-5);
  color: var(--color-text-disabled);
}
.empty-state p { font-size: var(--font-size-md); margin-top: var(--space-2); }

.no-data { font-size: var(--font-size-sm); color: var(--color-text-disabled); }

/* Responsive */
@media (max-width: 768px) {
  .detail-grid { grid-template-columns: 1fr; }
  .demo-switcher { flex-direction: column; align-items: flex-start; }
  .entry-form { flex-direction: column; align-items: stretch; }
  .summary-list li { flex-direction: column; gap: var(--space-1); }
  .summary-list__label { min-width: auto; }
}

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // ═══════════════════════════════════════════════════════════
        // SECTION: types (maps to types.ts)
        // ═══════════════════════════════════════════════════════════

        /** ProductType enum */
        const ProductType = Object.freeze({
            GENERAL_TICKET:      'GENERAL_TICKET',
            GENERAL_SHARE:       'GENERAL_SHARE',
            RESIDENT_SHARE:      'RESIDENT_SHARE',
            SUBSCRIPTION_TICKET: 'SUBSCRIPTION_TICKET',
            SHORT_TERM_TICKET:   'SHORT_TERM_TICKET',
        });

        /** ProductType → 한국어 라벨 */
        const ProductTypeLabel = Object.freeze({
            [ProductType.GENERAL_TICKET]:      '일반권',
            [ProductType.GENERAL_SHARE]:       '일반공유',
            [ProductType.RESIDENT_SHARE]:      '거주자공유',
            [ProductType.SUBSCRIPTION_TICKET]: '정기권',
            [ProductType.SHORT_TERM_TICKET]:   '단기권',
        });

        /** ProductType → CSS 클래스 */
        const ProductTypeClass = Object.freeze({
            [ProductType.GENERAL_TICKET]:      '',
            [ProductType.GENERAL_SHARE]:       'share',
            [ProductType.RESIDENT_SHARE]:      'resident',
            [ProductType.SUBSCRIPTION_TICKET]: 'pass',
            [ProductType.SHORT_TERM_TICKET]:   'short',
        });

        /** 주차권 기반 상품 유형 */
        const TICKET_BASED_TYPES = new Set([
            ProductType.GENERAL_TICKET,
            ProductType.SUBSCRIPTION_TICKET,
            ProductType.SHORT_TERM_TICKET,
        ]);

        /** 공유 기반 상품 유형 */
        const SHARE_BASED_TYPES = new Set([
            ProductType.GENERAL_SHARE,
            ProductType.RESIDENT_SHARE,
        ]);

        /** Section ID enum */
        const SectionId = Object.freeze({
            BASIC_INFO:          'basicInfo',
            USAGE_INFO:          'usageInfo',
            ENTRY_PROCESSING:    'entryProcessing',
            CUSTOMER_EXTRA_INFO: 'customerExtraInfo',
            TICKET_SUMMARY:      'ticketSummary',
        });

        /**
         * @typedef {Object} PaymentDetail
         * @property {string} id
         * @property {string} productType       - ProductType enum
         * @property {string} serviceName       - 이용 서비스 (예: "심야권", "일반공유")
         * @property {string} paymentId         - 결제번호
         * @property {string} paymentChannel    - 결제채널
         * @property {string} parkingStartAt    - 주차시작일시
         * @property {string} parkingEndAt      - 주차종료일시
         * @property {string} parkinglotId      - 주차장 ID
         * @property {string} parkinglotName    - 주차장명
         * @property {string|null} sectionName  - 구획 이름
         * @property {string} usageStatus       - 이용상태
         * @property {string} userId            - 회원번호
         * @property {string} userName          - 회원명
         * @property {string} vehicleNumber     - 차량번호
         * @property {Object|null} additionalCustomerInfo - 고객 입력 부가정보
         * @property {Object|null} ticketSummary  - 주차권 요약정보
         * @property {Object|null} entryProcessing - 입차 처리 정보
         * @property {Array|null} processingHistory - 처리 이력
         * @property {unknown} [raw]            - 확장용
         * @property {Record<string, unknown>} [meta] - 확장용
         */

        // ═══════════════════════════════════════════════════════════
        // SECTION: formatters (maps to formatters.ts)
        // ═══════════════════════════════════════════════════════════

        /**
         * null/undefined/빈문자열이면 fallback 반환, 아니면 formatter 적용
         */
        function formatNullable(value, fallback, formatter) {
            if (value === null || value === undefined || value === '') {
                return fallback !== undefined ? fallback : '-';
            }
            return formatter ? formatter(value) : value;
        }

        /** 값이 유효한지 (렌더 가능 여부) */
        function shouldRenderField(value) {
            return value !== null && value !== undefined && value !== '';
        }

        /** 필드 배열 중 하나라도 유효하면 true */
        function shouldRenderSection(fields) {
            return fields.some(f => shouldRenderField(f));
        }

        /** 날짜/시간 포맷 (향후 변경 가능하도록 유틸 분리) */
        function formatDateTime(dt) {
            if (!dt) return '-';
            return dt;
        }

        /** 날짜만 */
        function formatDateOnly(dt) {
            if (!dt) return '-';
            return dt.split(' ')[0] || '-';
        }

        /** 시간만 */
        function formatTimeOnly(dt) {
            if (!dt) return '';
            return dt.split(' ')[1] || '';
        }

        /** 금액 포맷 */
        function formatAmount(n) {
            if (!n && n !== 0) return '-';
            return n.toLocaleString() + '원';
        }

        /** 이용상태 → CSS 클래스 */
        function getUsageStatusClass(status) {
            switch (status) {
                case '이용대기': return 'waiting';
                case '이용가능': return 'available';
                case '이용중':   return 'active';
                case '이용종료': return 'done';
                default: return '';
            }
        }

        // ═══════════════════════════════════════════════════════════
        // SECTION: routing (maps to routing.ts)
        // ═══════════════════════════════════════════════════════════

        function goToPayment(paymentId) {
            console.log('[Navigate] 결제상세 →', paymentId);
            window.location.hash = '#/payment/' + paymentId;
        }

        function goToParkinglot(parkinglotId) {
            console.log('[Navigate] 주차장상세 →', parkinglotId);
            window.location.hash = '#/parkinglot/' + parkinglotId;
        }

        function goToUser(userId) {
            console.log('[Navigate] 회원상세 →', userId);
            window.location.hash = '#/user/' + userId;
        }

        // ═══════════════════════════════════════════════════════════
        // SECTION: sectionConfig (maps to sectionConfig.ts)
        // ═══════════════════════════════════════════════════════════

        /**
         * sectionConfigByProductType
         * 각 상품유형이 표시할 섹션 목록과 순서.
         * 렌더 시 이 배열을 map하여 섹션을 순서대로 출력한다.
         */
        const sectionConfigByProductType = Object.freeze({
            [ProductType.GENERAL_TICKET]: [
                { id: SectionId.BASIC_INFO },
                { id: SectionId.USAGE_INFO },
                { id: SectionId.ENTRY_PROCESSING },
                { id: SectionId.CUSTOMER_EXTRA_INFO, condition: 'hasAdditionalInfo' },
                { id: SectionId.TICKET_SUMMARY },
            ],
            [ProductType.GENERAL_SHARE]: [
                { id: SectionId.BASIC_INFO },
                { id: SectionId.USAGE_INFO },
                // ENTRY_PROCESSING: 공유 상품은 기본 숨김 (확장 가능하도록 주석으로 남김)
                // { id: SectionId.ENTRY_PROCESSING, hidden: true },
                { id: SectionId.CUSTOMER_EXTRA_INFO, condition: 'hasAdditionalInfo' },
                // TICKET_SUMMARY: 공유 상품은 절대 미노출
            ],
            [ProductType.RESIDENT_SHARE]: [
                { id: SectionId.BASIC_INFO },
                { id: SectionId.USAGE_INFO },
                // ENTRY_PROCESSING: 공유 상품은 기본 숨김
                // { id: SectionId.ENTRY_PROCESSING, hidden: true },
                { id: SectionId.CUSTOMER_EXTRA_INFO, condition: 'hasAdditionalInfo' },
                // TICKET_SUMMARY: 공유 상품은 절대 미노출
            ],
            [ProductType.SUBSCRIPTION_TICKET]: [
                { id: SectionId.BASIC_INFO },
                { id: SectionId.USAGE_INFO },
                { id: SectionId.ENTRY_PROCESSING },
                { id: SectionId.CUSTOMER_EXTRA_INFO, condition: 'hasAdditionalInfo' },
                { id: SectionId.TICKET_SUMMARY },
            ],
            [ProductType.SHORT_TERM_TICKET]: [
                { id: SectionId.BASIC_INFO },
                { id: SectionId.USAGE_INFO },
                { id: SectionId.ENTRY_PROCESSING },
                { id: SectionId.CUSTOMER_EXTRA_INFO, condition: 'hasAdditionalInfo' },
                { id: SectionId.TICKET_SUMMARY },
            ],
        });

        /** 조건 평가: 섹션이 실제로 렌더될지 결정 */
        function evaluateSectionCondition(config, data) {
            if (!config.condition) return true;
            switch (config.condition) {
                case 'hasAdditionalInfo':
                    return data.additionalCustomerInfo != null;
                default:
                    return true;
            }
        }

        // ═══════════════════════════════════════════════════════════

                    </button>
                    <div className="header__logo">
                        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                            <rect x="2" y="2" width="28" height="28" rx="8" fill="#00A8FF"/>
                            <text x="16" y="22" textAnchor="middle" fontSize="18" fontWeight="700" fill="#fff" fontFamily="sans-serif">P</text>
                        </svg>
                        모두의주차장 관리자
                        <span className="header__env">dev</span>
                    </div>
                    <div className="header__right">
                        <span className="header__user">elice님</span>
                        <a href="javascript:void(0)" className="header__link">내정보</a>
                        <a href="javascript:void(0)" className="header__link">로그아웃</a>
                    </div>
                </header>
            );
        }

        // ── LNB ──
        function LNB({ isOpen }) {
            const [openGroups, setOpenGroups] = useState({ sales: true });
            const toggleGroup = (groupId) => {
                setOpenGroups(prev => ({ ...prev, [groupId]: !prev[groupId] }));
            };
            return (
                <nav className={`lnb ${isOpen ? 'open' : ''}`}>
                    {LNB_MENUS.map(menu => (
                        <div key={menu.id}>
                            <div
                                className={`lnb-group-label ${openGroups[menu.id] ? 'open' : ''}`}
                                onClick={() => toggleGroup(menu.id)}
                            >
                                {menu.label} <span className="arrow">▼</span>
                            </div>
                            <div className={`lnb-group-children ${openGroups[menu.id] ? 'open' : ''}`}>
                                {menu.children.map(child => (
                                    <a
                                        key={child.label}
                                        className={`lnb-item ${child.active ? 'active' : ''}`}
                                        href={child.href || '#'}
                                        style={child.indent ? {paddingLeft:'48px'} : undefined}
                                    >{child.label}</a>
                                ))}
                            </div>
                        </div>
                    ))}
                </nav>
            );
        }

        // ── Footer ──
        function Footer() {
            const [footerText, setFooterText] = useState('');
            useEffect(() => {
                const lastMod = new Date(document.lastModified);
                const yyyy = lastMod.getFullYear();
                const MM = String(lastMod.getMonth() + 1).padStart(2, '0');
                const dd = String(lastMod.getDate()).padStart(2, '0');
                const hh = String(lastMod.getHours()).padStart(2, '0');
                const mm = String(lastMod.getMinutes()).padStart(2, '0');
                setFooterText(`\u00A9 2026. 주차권예매서비스. 최종업데이트 : ${yyyy}.${MM}.${dd} ${hh}:${mm}`);
            }, []);
            return <footer className="footer">{footerText}</footer>;
        }

        // ── Toast ──
        function Toast({ toast, onDone }) {
            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => onDone(), 3000);
                return () => clearTimeout(t);
            }, [toast]);

            if (!toast) return null;
            return (
                <div className="toast-container">
                    <div className={`toast ${toast.type}`}>{toast.message}</div>
                </div>
            );
        }

        // ── ProductType Switcher (데모용) ──
        function ProductTypeSwitcher({ selectedType, onChange }) {
            return (
                <div className="demo-switcher">
                    <span className="demo-switcher__label">DEMO: 상품유형 선택</span>
                    <div className="demo-switcher__buttons">
                        {Object.entries(ProductTypeLabel).map(([key, label]) => (
                            <button
                                key={key}
                                className={`demo-switcher__btn ${selectedType === key ? 'active' : ''}`}
                                onClick={() => onChange(key)}
                            >
                                {label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // ── DemoPage (Root) ──
        function DemoPage() {
            const [selectedType, setSelectedType] = useState(ProductType.GENERAL_TICKET);
            const [toast, setToast] = useState(null);
            const [lnbOpen, setLnbOpen] = useState(false);

            const currentData = MOCK_PAYMENT_DETAILS[selectedType];

            return (
                <div className="app-layout">
                    <Header onMenuToggle={() => setLnbOpen(prev => !prev)} />
                    <div className={`lnb-overlay ${lnbOpen ? 'show' : ''}`} onClick={() => setLnbOpen(false)} />
                    <LNB isOpen={lnbOpen} />
                    <main className="main">
                        <div className="page-header">
                            <div className="main__breadcrumb">
                                판매관리 &gt; 주차관리 &gt; <span>결제주차권 상세</span>
                            </div>
                            <h1 className="page-title">결제주차권 상세</h1>
                            <p className="page-subtitle">결제된 주차권의 상세 정보를 확인합니다.</p>
                        </div>

                        <ProductTypeSwitcher
                            selectedType={selectedType}
                            onChange={setSelectedType}
                        />

                        <PaymentDetailView
                            data={currentData}
                            onToast={setToast}
                        />
                    </main>

                    <Footer />
                    <Toast toast={toast} onDone={() => setToast(null)} />
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════
        // Render
        // ═══════════════════════════════════════════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DemoPage />);
    </script>
</body>
</html>
