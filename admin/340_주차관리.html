    // ============================================================
    // parking-ticket-table.js (인라인)
    // 공통 주차권 목록 테이블 컴포넌트
    // ============================================================
    (function () {
        'use strict';

        function ParkingTicketTable({
            columns,
            data,
            onRowClick,
            tableClassName = 'data-table',
            emptyMessage = '검색 결과가 없습니다.',
            emptyIcon,
            emptyClassName = 'empty-state'
        }) {
            return (
                <table className={tableClassName}>
                    <thead>
                        <tr>
                            {columns.map((col, i) => (
                                <th key={col.key || i} style={col.headerStyle}>{col.header}</th>
                            ))}
                        </tr>
                    </thead>
                    <tbody>
                        {data.length === 0 ? (
                            <tr>
                                <td colSpan={columns.length}>
                                    <div className={emptyClassName}>
                                        {emptyIcon && <div className={`${emptyClassName}-icon`}>{emptyIcon}</div>}
                                        <p>{emptyMessage}</p>
                                    </div>
                                </td>
                            </tr>
                        ) : (
                            data.map((item, idx) => (
                                <tr key={item.id || idx} onClick={onRowClick ? () => onRowClick(item) : undefined}>
                                    {columns.map((col, colIdx) => (
                                        <td key={col.key || colIdx} className={col.className}>
                                            {col.render ? col.render(item) : item[col.key]}
                                        </td>
                                    ))}
                                </tr>
                            ))
                        )}
                    </tbody>
                </table>
            );
        }

        function Pagination({ currentPage, totalPages, onPageChange }) {
            if (totalPages <= 1) return null;

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, startPage + 4);
            const pages = [];
            for (let i = startPage; i <= endPage; i++) pages.push(i);

            return (
                <div className="pagination-wrapper">
                    <button className="page-btn" disabled={currentPage <= 1} onClick={() => onPageChange(1)}>«</button>
                    <button className="page-btn" disabled={currentPage <= 1} onClick={() => onPageChange(currentPage - 1)}>‹</button>
                    {pages.map(p => (
                        <button key={p} className={`page-btn ${p === currentPage ? 'active' : ''}`}
                            onClick={() => onPageChange(p)}>{p}</button>
                    ))}
                    <button className="page-btn" disabled={currentPage >= totalPages} onClick={() => onPageChange(currentPage + 1)}>›</button>
                    <button className="page-btn" disabled={currentPage >= totalPages} onClick={() => onPageChange(totalPages)}>»</button>
                </div>
            );
        }

        window.ParkingTicketTable = ParkingTicketTable;
        window.Pagination = Pagination;
    })();
    </script>

        // ============================================================
        // Utility Functions
        // ============================================================
        function formatDateTime(dt) {
            if (!dt) return '-';
            const parts = dt.split(' ');
            if (parts.length === 2) return `${parts[0]}\n${parts[1]}`;
            return dt;
        }

        // formatDateOnly, formatTimeOnly, getProductTypeClass, getEntryStatusClass,
        // getPaymentStatusClass → parking-detail-panel.js

        function formatAmount(n) {
            if (!n && n !== 0) return '-';
            return n.toLocaleString() + '원';
        }

        function getEntryStatus(vehicle) {
            const now = new Date();
            const hasEntry = !!vehicle.entryTime;
            const hasExit = !!vehicle.exitTime;
            const usageStart = new Date(vehicle.usagePeriodStart);
            const usageEnd = new Date(vehicle.usagePeriodEnd);

            if (hasExit || now > usageEnd) return '이용종료';
            if (hasEntry && now >= usageStart && now <= usageEnd) return '이용중';
            if (!hasEntry && now >= usageStart && now <= usageEnd) return '이용가능';
            if (now < usageStart) return '이용대기';
            return '이용종료';
        }

1        // Types, Constants, Formatters, Routing, Section Config
        // → parking-detail-panel.js 로 분리됨

        /** 기존 vehicle 데이터 → 상세 뷰용 enriched 데이터로 변환 */
        function enrichForDetail(vehicle) {
            const enumType = KoreanToProductType[vehicle.productType] || ProductType.GENERAL_TICKET;
            const hasExtraInfo = shouldRenderSection([
                vehicle.departureFlight, vehicle.arrivalFlight, vehicle.vehicleModel
            ]);
            return {
                ...vehicle,
                _enumType: enumType,
                paymentId: String(10000000 + parseInt(vehicle.id.replace('VH-', ''), 10)),
                paymentChannel: '모두의주차장 앱',
                userId: 'USR-' + vehicle.id.replace('VH-', ''),
                sectionName: null,
                usageStatus: getEntryStatus(vehicle),
                additionalCustomerInfo: hasExtraInfo ? {
                    departureFlight: vehicle.departureFlight || null,
                    arrivalFlight: vehicle.arrivalFlight || null,
                    vehicleModel: vehicle.vehicleModel || null,
                } : null,
                ticketSummary: TICKET_BASED_TYPES.has(enumType)
                    ? (TICKET_SUMMARY_BY_TYPE[vehicle.productType] || null)

                        processedAt: vehicle.entryTime,
                        handler: 'SYSTEM',
                    },
                ] : [],
                raw: null,
                meta: {},
            };
        }

        // ============================================================
        // SearchableDropdown Component
        // ============================================================
        function SearchableDropdown({ options, value, onChange, placeholder }) {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState('');
            const ref = useRef(null);

            useEffect(() => {
                function handleClickOutside(e) {
                    if (ref.current && !ref.current.contains(e.target)) setIsOpen(false);
                }
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filtered = useMemo(() => {
                if (!search) return options;
                return options.filter(o => o.name.includes(search));
            }, [options, search]);

            const displayValue = value
                ? options.find(o => o.id === value)?.name || ''
                : '';

            return (
                <div className="searchable-dropdown" ref={ref}>
                    <input
                        className="filter-input filter-input-parking"
                        placeholder={placeholder}
                        value={isOpen ? search : displayValue}
                        onChange={e => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
                        onFocus={() => { setIsOpen(true); setSearch(''); }}
                    />
                    {isOpen && (
                        <div className="searchable-dropdown-menu">
                            <div
                                className={`searchable-dropdown-item ${!value ? 'selected' : ''}`}
                                onClick={() => { onChange(''); setIsOpen(false); setSearch(''); }}
                            >전체</div>
                            {filtered.map(opt => (
                                <div
                                    key={opt.id}
                                    className={`searchable-dropdown-item ${value === opt.id ? 'selected' : ''}`}
                                    onClick={() => { onChange(opt.id); setIsOpen(false); setSearch(''); }}
                                >{opt.name}</div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Pagination → parking-ticket-table.js (window.Pagination)

        // ============================================================
        // Panel Sub-Sections (카드 기반 컴포넌트)
        // ============================================================


        // SectionCard, Panel*, VehicleDetailPanel, SECTION_COMPONENT_MAP
        // → parking-detail-panel.js (window.DetailPanel)


        // ============================================================
        // Footer Component
        // ============================================================
        function Footer() {
            const [footerText, setFooterText] = useState('');
            useEffect(() => {
                const lastMod = new Date(document.lastModified);
                const yyyy = lastMod.getFullYear();
                const MM = String(lastMod.getMonth() + 1).padStart(2, '0');
                const dd = String(lastMod.getDate()).padStart(2, '0');
                const hh = String(lastMod.getHours()).padStart(2, '0');
                const mm = String(lastMod.getMinutes()).padStart(2, '0');
                setFooterText(`\u00A9 2026. 주차권예매서비스. 최종업데이트 : ${yyyy}.${MM}.${dd} ${hh}:${mm}`);
            }, []);
            return <footer className="footer">{footerText}</footer>;
        }

        // ============================================================
        // Toast Component
        // ============================================================
        function Toast({ toast, onDone }) {
            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => onDone(), 3000);
                return () => clearTimeout(t);
            }, [toast]);

            if (!toast) return null;
            return (
                <div className="toast-container">
                    <div className={`toast ${toast.type}`}>{toast.message}</div>
                </div>
            );
        }

        // ============================================================
        // Main App Component
        // ============================================================
        // ============================================================
        // Date Utility
        // ============================================================
        function formatDateISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        const TODAY = formatDateISO(new Date());

        // ============================================================
        // SearchFilter Component
        // ============================================================
        function SearchFilter({ onSearch }) {
            const [periodType, setPeriodType] = useState('paymentDate');
            const [startDate, setStartDate] = useState(TODAY);
            const [endDate, setEndDate] = useState(TODAY);

            const [manager, setManager] = useState('');

            const CURRENT_USER_ID = '9999'; // 현재 로그인한 사용자 ID (elice)

            const MANAGER_OPTIONS = [

                { value: '2516', label: 'lush(lush@socar.kr)' },
                { value: '2497', label: 'quinn(quinn@socar.kr)' },
                { value: '2530', label: 'rini(rini@socar.kr)' },
                { value: '2525', label: 'shane(shane@socar.kr)' },
                { value: '2502', label: 'smooth(smooth@socar.kr)' },
                { value: '2405', label: 'socar_rpa(socar_rpa)' },
            ];

            const sortedManagerOptions = useMemo(() => {
                const current = MANAGER_OPTIONS.find(m => m.value === CURRENT_USER_ID);
                const rest = MANAGER_OPTIONS.filter(m => m.value !== CURRENT_USER_ID);
                return current ? [current, ...rest] : MANAGER_OPTIONS;
            }, []);

            const ENTRY_STATUS_OPTIONS = [
                { value: '', label: '전체' },
                { value: '이용대기', label: '이용대기' },
                { value: '이용가능', label: '이용가능' },
                { value: '이용중', label: '이용중' },
                { value: '이용종료', label: '이용종료' },
            ];

            const applyQuickRange = useCallback((range) => {
                const today = new Date();
                let start = new Date();
                if (range === 'today') {
                    start = today;
                } else if (range === 'week') {
                    start.setDate(today.getDate() - 7);
                } else if (range === 'month') {
                    start.setMonth(today.getMonth() - 1);
                }
                setStartDate(formatDateISO(start));
                setEndDate(formatDateISO(today));
                setQuickRange(range);
            }, []);

            const handleDateChange = useCallback((type, value) => {
                if (type === 'start') setStartDate(value);
                else setEndDate(value);
                setQuickRange('');
            }, []);

            const handleSearch = useCallback(() => {
                onSearch({ periodType, startDate, endDate, searchFieldType, searchKeyword, paymentStatus, serviceType, entryStatus, manager });
            }, [periodType, startDate, endDate, searchFieldType, searchKeyword, paymentStatus, serviceType, entryStatus, manager, onSearch]);

            const handleKeyDown = useCallback((e) => {
                if (e.key === 'Enter') handleSearch();
            }, [handleSearch]);

            return (
                <div className="filter-card">
                    {/* 1행: 조회기간 */}
                    <div className="filter-row">
                        <span className="filter-label">조회기간</span>
                        <select className="filter-select" value={periodType} onChange={e => setPeriodType(e.target.value)}>
                            <option value="paymentDate">결제일</option>
                            <option value="cancelDate">결제취소일</option>
                            <option value="usageStartDate">이용시작일</option>
                            <option value="usageEndDate">이용종료일</option>
                        </select>
                        <div className="quick-btn-group">
                            {[['today','오늘'],['week','1주일'],['month','1개월']].map(([key, label]) => (
                                <button key={key} className={`quick-btn ${quickRange === key ? 'active' : ''}`}
                                    onClick={() => applyQuickRange(key)}>{label}</button>
                            ))}
                        </div>
                        <input type="date" className="filter-date" value={startDate}
                            onChange={e => handleDateChange('start', e.target.value)} />
                        <span className="date-separator">-</span>
                        <input type="date" className="filter-date" value={endDate}
                            onChange={e => handleDateChange('end', e.target.value)} />
                    </div>

                    {/* 2행: 검색어 */}
                    <div className="filter-row">
                        <span className="filter-label">검색어</span>
                        <select className="filter-select" value={searchFieldType} onChange={e => setSearchFieldType(e.target.value)}>
                            <option value="paymentNo">결제번호</option>
                            <option value="contact">연락처</option>
                            <option value="vehicleNo">차량번호</option>
                            <option value="memberName">회원명</option>
                            <option value="partnerParkingNo">제휴주차장 고유번호</option>
                            <option value="partnerParkingName">제휴주차장 이름</option>
                            <option value="residentSection">거주자공유 구간 / 구획번호</option>
                            <option value="generalParkingName">일반공유주차장 이름</option>

                        </select>
                        <input type="text" className="filter-input" placeholder="검색어를 입력하세요"
                            value={searchKeyword} onChange={e => setSearchKeyword(e.target.value)}

                    </div>

                    {/* 3행: 상세조건 */}
                    <div className="filter-row">
                        <span className="filter-label">상세조건</span>
                        <span className="filter-sub-label">결제상태</span>

                    {/* 검색 버튼 */}

        // ============================================================
        // Main App Component
        // ============================================================
        function App() {
            const [vehicles, setVehicles] = useState(DUMMY_VEHICLES);
            const [searchParams, setSearchParams] = useState({});
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            const [toast, setToast] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);
            // Search handler
            const handleSearch = useCallback((params) => {
                setSearchParams(params);
                setCurrentPage(1);

                // 쿼리스트링 생성 및 콘솔 출력
                const queryParts = [];
                for (const key in params) {
                    if (params[key] !== '') {
                        queryParts.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
                    }
                }
                const url = '/api/parking-tickets/search?' + queryParts.join('&');
                console.log('[검색 요청]', url);
                console.log('[필터 상태]', JSON.stringify(params, null, 2));

                // TODO: 실제 API 호출
                // fetch(url).then(res => res.json()).then(data => { ... });
            }, []);

            // Filtering (로컬 mock 필터링)
            const filteredVehicles = useMemo(() => {
                return vehicles.filter(v => {
                    // 결제상태 필터
                    if (searchParams.paymentStatus) {
                        const statusMap = { paying: '결제중', paid: '결제완료', cancelled: '결제취소' };
                        if (v.paymentStatus !== statusMap[searchParams.paymentStatus]) return false;
                    }
                    // 구매 서비스 필터
                    if (searchParams.serviceType) {
                        const serviceMap = { general: '일반권', generalShare: '일반공유', residentShare: '거주자공유', pass: '정기권', shortTerm: '단기권' };
                        if (v.productType !== serviceMap[searchParams.serviceType]) return false;
                    }
                    // 이용상태 필터
                    if (searchParams.entryStatus) {
                        if (getEntryStatus(v) !== searchParams.entryStatus) return false;
                    }
                    // 검색어 필터
                    if (searchParams.searchKeyword) {
                        const keyword = searchParams.searchKeyword;
                        const fieldMap = {
                            vehicleNo: () => v.vehicleNumber.includes(keyword),
                            memberName: () => v.buyerName.includes(keyword),
                            contact: () => v.buyerPhone.includes(keyword),
                            partnerParkingName: () => v.parkingLotName.includes(keyword),
                        };
                        const checker = fieldMap[searchParams.searchFieldType];
                        if (checker && !checker()) return false;
                    }
                    return true;
                });
            }, [vehicles, searchParams]);

            // Pagination
            const totalPages = Math.ceil(filteredVehicles.length / ITEMS_PER_PAGE);
            const paginatedVehicles = useMemo(() => {
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredVehicles.slice(start, start + ITEMS_PER_PAGE);
            }, [filteredVehicles, currentPage]);

            useEffect(() => { setCurrentPage(1); }, [searchParams]);

            // Save buyer info handler
            const handleSave = useCallback((vehicleId, updatedFields) => {
                setVehicles(prev => prev.map(v => v.id === vehicleId ? { ...v, ...updatedFields } : v));
                setSelectedVehicle(prev => prev && prev.id === vehicleId ? { ...prev, ...updatedFields } : prev);
                setToast({ type: 'success', message: '구매자 정보가 수정되었습니다.' });
            }, []);

            // 테이블 컬럼 정의 (ParkingTicketTable 공통 컴포넌트용)
            const vehicleColumns = useMemo(() => [
                {
                    key: 'vehicleNumber', header: '차량번호',
                    render: (v) => (
                        <div className="td-vehicle">
                            <span className="vehicle-number">{v.vehicleNumber}</span>
                        </div>
                    )
                },
                {
                    key: 'productType', header: '상품유형',
                    render: (v) => (
                        <span className={`product-type-tag ${getProductTypeClass(v.productType)}`}>
                            {v.productType}
                        </span>
                    )
                },
                {
                    key: 'parkingLotName', header: '주차장명', className: 'td-parking',
                    render: (v) => (
                        <>
                            {v.parkingLotName}
                            {v.isWebDiscount && <span className="parking-type-tag" style={{marginLeft: 6}}>웹할인</span>}
                        </>
                    )
                },
                { key: 'productName', header: '상품명', className: 'td-product' },
                {
                    key: 'usagePeriodStart', header: '이용시작', className: 'td-datetime',
                    render: (v) => <>{formatDateOnly(v.usagePeriodStart)}<br/>{formatTimeOnly(v.usagePeriodStart)}</>
                },
                {
                    key: 'usagePeriodEnd', header: '이용종료', className: 'td-datetime',
                    render: (v) => <>{formatDateOnly(v.usagePeriodEnd)}<br/>{formatTimeOnly(v.usagePeriodEnd)}</>
                },
                {
                    key: 'expectedEntryTime', header: '입차예상', className: 'td-datetime',
                    render: (v) => v.expectedEntryTime
                        ? <>{formatDateOnly(v.expectedEntryTime)}<br/>{formatTimeOnly(v.expectedEntryTime)}</>
                        : <span className="no-data">-</span>
                },
                {
                    key: 'entryTime', header: '입차일시', className: 'td-datetime',
                    render: (v) => v.entryTime
                        ? <>{formatDateOnly(v.entryTime)}<br/>{formatTimeOnly(v.entryTime)}</>
                        : <span className="no-data">-</span>
                },
                {
                    key: 'exitTime', header: '출차일시', className: 'td-datetime',
                    render: (v) => v.exitTime
                        ? <>{formatDateOnly(v.exitTime)}<br/>{formatTimeOnly(v.exitTime)}</>
                        : <span className="no-data">-</span>
                },
                {
                    key: 'entryStatus', header: '이용상태',
                    render: (v) => {
                        const status = getEntryStatus(v);
                        return <span className={`entry-status ${getEntryStatusClass(status)}`}>{status}</span>;
                    }
                },
                {
                    key: 'paymentStatus', header: '결제상태',
                    render: (v) => (
                        <span className={`payment-status ${getPaymentStatusClass(v.paymentStatus)}`}>
                            {v.paymentStatus}
                        </span>
                    )
                },
            ], []);

            return (
                <>
                    <main className="main">
                        {/* Page Header */}
                        <div className="page-header">
                            <div className="main__breadcrumb">
                                판매관리 &gt; <span>주차관리</span>
                            </div>
                            <h1 className="page-title">주차관리</h1>
                            <p className="page-subtitle">관리 권한이 있는 주차장의 결제주차권 현황을 확인합니다.</p>
                        </div>

                        {/* Search Filter */}
                        <SearchFilter onSearch={handleSearch} />

                        {/* Data Table — ParkingTicketTable 공통 컴포넌트 사용 */}
                        <div className="table-card">
                            <div className="table-header">차량 목록</div>
                            <ParkingTicketTable
                                columns={vehicleColumns}
                                data={paginatedVehicles}
                                onRowClick={setSelectedVehicle}
                                tableClassName="data-table"
                                emptyMessage="검색 결과가 없습니다."
                            />
                            <Pagination
                                currentPage={currentPage}
                                totalPages={totalPages}
                                onPageChange={setCurrentPage}
                            />
                        </div>
                    </main>

                    {/* Detail Panel */}
                    <DetailPanel
                        item={selectedVehicle}
                        enrichFn={enrichForDetail}
                        onClose={() => setSelectedVehicle(null)}
                        onSave={handleSave}
                    />

                    {/* Footer */}
                    <Footer />

                    {/* Toast */}
                    <Toast toast={toast} onDone={() => setToast(null)} />
                </>
            );
        }

        // ============================================================
        // Render
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
